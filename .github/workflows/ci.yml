name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i -g @anthropic-ai/claude-code @opencode/cli
      - run: claude --version && opencode --version
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:install

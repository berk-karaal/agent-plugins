# Worktrunk hooks for this hub (WORKTRUNK_PROJECT_CONFIG_PATH in mise.toml points here).

# New branches start from the local default branch: keep it on the remote's.
[pre-switch]
sync-default = "git fetch -q {{ remote }} && git -C {{ primary_worktree_path }} merge -q --ff-only {{ remote }}/{{ default_branch }}"

[[pre-start]]
copy-local = "wt step copy-ignored --require-include"

# PROJECT VALUES: one line per generated variable; delete this whole step if there are none.
[[pre-start]]
worktree-env = """
cat > .mise.local.toml <<'EOF'
# Generated by the hub's wt.toml when this worktree was created. Do not edit.
[env]
EXAMPLE_PORT = "{{ (remote_url ~ '/' ~ branch) | hash_port }}"
EOF
"""

[[pre-start]]
trust = "mise trust -q ."
